<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Gold schema diagram</title>
  <desc id="desc">Visual diagram for Gold analytical datasets: vw_llm_training and mart_exam_stats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12091f"/>
      <stop offset="100%" stop-color="#211036"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b2676"/>
      <stop offset="100%" stop-color="#301646"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#05020a" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#bb86fc"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)" rx="28"/>
  <text x="60" y="70" fill="#f4edff" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Camada Gold</text>
  <text x="60" y="106" fill="#cdbcf3" font-size="18" font-family="Segoe UI, Arial, sans-serif">Datasets analiticos para treino de LLM e estatisticas por exame</text>

  <rect x="60" y="140" width="600" height="360" rx="24" fill="url(#card)" stroke="#d5b2ff" stroke-opacity="0.36" filter="url(#shadow)"/>
  <text x="90" y="184" fill="#f5d9ff" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700">vw_llm_training</text>
  <text x="90" y="222" fill="#f4edff" font-size="17" font-family="Consolas, monospace">PK training_id</text>
  <text x="90" y="252" fill="#f4edff" font-size="17" font-family="Consolas, monospace">FK exam_id / question_id</text>
  <text x="90" y="282" fill="#f4edff" font-size="17" font-family="Consolas, monospace">messages: Array&lt;Struct{role, content}&gt;</text>
  <text x="90" y="312" fill="#f4edff" font-size="17" font-family="Consolas, monospace">topik_level / topic</text>
  <text x="90" y="342" fill="#f4edff" font-size="17" font-family="Consolas, monospace">difficulty_level / question_type</text>
  <text x="90" y="372" fill="#f4edff" font-size="17" font-family="Consolas, monospace">confidence</text>
  <text x="90" y="420" fill="#cdbcf3" font-size="16" font-family="Segoe UI, Arial, sans-serif">Uma linha por questao completa no formato ChatML</text>
  <text x="90" y="444" fill="#cdbcf3" font-size="16" font-family="Segoe UI, Arial, sans-serif">Pronto para Dataset.from_spark()</text>

  <rect x="720" y="160" width="360" height="300" rx="24" fill="url(#card)" stroke="#d5b2ff" stroke-opacity="0.36" filter="url(#shadow)"/>
  <text x="750" y="204" fill="#f5d9ff" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700">mart_exam_stats</text>
  <text x="750" y="242" fill="#f4edff" font-size="17" font-family="Consolas, monospace">PK stats_id / FK exam_id</text>
  <text x="750" y="272" fill="#f4edff" font-size="17" font-family="Consolas, monospace">total_questions</text>
  <text x="750" y="302" fill="#f4edff" font-size="17" font-family="Consolas, monospace">total_answers</text>
  <text x="750" y="332" fill="#f4edff" font-size="17" font-family="Consolas, monospace">avg_word_count_question</text>
  <text x="750" y="362" fill="#f4edff" font-size="17" font-family="Consolas, monospace">avg_word_count_answer</text>
  <text x="750" y="392" fill="#f4edff" font-size="17" font-family="Consolas, monospace">distribution_by_difficulty</text>
  <text x="750" y="422" fill="#f4edff" font-size="17" font-family="Consolas, monospace">distribution_by_type / last_updated</text>

  <path d="M660 320 C690 320, 700 320, 720 320" stroke="#bb86fc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="665" y="300" fill="#cdbcf3" font-size="16" font-family="Segoe UI, Arial, sans-serif">agregacoes</text>

  <text x="60" y="620" fill="#e0c3ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">A Gold reorganiza a Silver em produtos de dados prontos:</text>
  <text x="60" y="648" fill="#e0c3ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">exemplos de treino no formato ChatML e metricas agregadas por exame.</text>
</svg>